<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Klauncher</title>
    <style>
        :root {
            --canvas: #1d2021;
            --launcher: #282828;
            --hover: #32302f;
            --selected: #3c3836;
            --border: #665c54;
            --foreground: #ebdbb2;
            --secondary: #a89984;
            --panel-width: 520px;
            --panel-height: 300px;
            --mono: "JetBrainsMono Nerd Font Mono", "SFMono-Regular", Consolas, monospace;
        }

        * { box-sizing: border-box; }

        html,
        body {
            min-width: 320px;
            min-height: 100%;
            margin: 0;
            background: var(--canvas);
        }

        body {
            min-height: 100svh;
            color: var(--foreground);
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.4;
        }

        button,
        input { font: inherit; }

        button { cursor: pointer; }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        button:focus-visible {
            outline: 1px solid var(--border);
            outline-offset: -1px;
        }

        .launcher-page { min-height: 100svh; }

        .stage {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100svh;
            padding: 24px;
            overflow: auto;
            background: var(--canvas);
        }

        .launcher-panel {
            position: relative;
            display: flex;
            width: var(--panel-width);
            height: var(--panel-height);
            flex: 0 0 var(--panel-width);
            flex-direction: column;
            overflow: hidden;
            border: 2px solid var(--border);
            border-radius: 2px;
            background: var(--launcher);
            color: var(--foreground);
            font-family: var(--mono);
        }

        .launcher-panel[aria-busy="true"] { cursor: wait; }

        .launcher-form {
            display: flex;
            align-items: center;
            gap: 10px;
            min-height: 48px;
            padding: 0 14px;
            border-bottom: 1px solid var(--border);
        }

        .launcher-prompt {
            flex: 0 0 auto;
            color: var(--secondary);
        }

        .launcher-input {
            min-width: 0;
            flex: 1;
            padding: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: var(--foreground);
            caret-color: var(--foreground);
            font-family: var(--mono);
            font-size: 13px;
            letter-spacing: 0;
        }

        .launcher-input::placeholder {
            color: var(--secondary);
            opacity: 1;
        }

        .launcher-input:disabled {
            cursor: wait;
            opacity: 0.72;
        }

        .launcher-list {
            display: grid;
            min-height: 0;
            flex: 1 1 auto;
            padding: 7px;
            overflow-x: hidden;
            overflow-y: auto;
            scrollbar-color: var(--border) transparent;
            scrollbar-width: thin;
        }

        .launcher-list > * {
            grid-area: 1 / 1;
            min-width: 0;
            min-height: 0;
        }

        .app-row {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            min-height: 38px;
            padding: 0 10px 0 8px;
            border: 0;
            border-left: 2px solid transparent;
            border-radius: 0;
            background: transparent;
            color: var(--foreground);
            text-align: left;
        }

        .app-row:hover,
        .app-row:focus-visible {
            background: var(--hover);
        }

        .app-row.is-selected,
        .app-row.is-launching {
            background: var(--selected);
            border-left-color: var(--border);
        }

        .app-icon {
            display: grid;
            width: 18px;
            height: 18px;
            margin-right: 10px;
            flex: 0 0 auto;
            place-items: center;
            border: 0;
            background: transparent;
            box-shadow: none;
            outline: 0;
        }

        .app-icon img {
            display: block;
            width: 18px;
            height: 18px;
            border: 0;
            background: transparent;
            box-shadow: none;
            object-fit: contain;
        }

        .app-copy { min-width: 0; }

        .app-name {
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .app-name {
            color: currentColor;
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0;
        }

        .empty-state {
            display: flex;
            height: 100%;
            align-items: center;
            justify-content: center;
            padding: 24px;
            flex-direction: column;
            gap: 4px;
            color: var(--secondary);
            font-size: 13px;
            text-align: center;
        }

        .empty-state[hidden] { display: none; }

        .empty-state strong {
            color: var(--secondary);
            font-size: 13px;
            font-weight: 400;
        }

        .reopen-button {
            min-height: 32px;
            padding: 0 12px;
            border: 2px solid var(--border);
            border-radius: 1px;
            background: var(--launcher);
            color: var(--secondary);
            font-family: var(--mono);
            font-size: 13px;
        }

        .reopen-button:hover,
        .reopen-button:focus-visible {
            background: var(--hover);
            color: var(--foreground);
        }

        @media (max-width: 620px) {
            .stage {
                align-items: flex-start;
                justify-content: flex-start;
                padding: 14px;
            }
        }

        @media (max-height: 360px) {
            .stage {
                align-items: flex-start;
                padding-block: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { scroll-behavior: auto !important; }
        }
    </style>
</head>
<body>
    <main class="launcher-page">
        <h1 class="sr-only">Klauncher application launcher</h1>
        <div class="stage">
            <section class="launcher-panel" id="launcher-panel" aria-label="Klauncher application launcher">
                <form class="launcher-form" id="launcher-form">
                    <label class="sr-only" for="launcher-input">Search applications</label>
                    <span class="launcher-prompt" aria-hidden="true">&gt;</span>
                    <input class="launcher-input" id="launcher-input" type="search" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-haspopup="listbox" placeholder="search applications..." autocomplete="off" spellcheck="false" aria-controls="launcher-listbox" aria-describedby="launcher-help" aria-activedescendant="app-visual-studio-code">
                    <span class="sr-only" id="launcher-help">Use Up and Down to navigate, Enter to launch, or Escape to close.</span>
                </form>

                <div class="launcher-list" id="launcher-list">
                    <div class="launcher-options" id="launcher-listbox" role="listbox" aria-label="Available applications">
                        <button class="app-row is-selected" id="app-visual-studio-code" type="button" role="option" aria-selected="true" tabindex="-1" data-name="Visual Studio Code">
                            <span class="app-icon" aria-hidden="true"><img src="file:///usr/share/icons/WhiteSur/apps/scalable/visual-studio-code.svg" alt=""></span>
                            <span class="app-copy"><span class="app-name">Visual Studio Code</span></span>
                        </button>
                        <button class="app-row" id="app-firefox" type="button" role="option" aria-selected="false" tabindex="-1" data-name="Firefox">
                            <span class="app-icon" aria-hidden="true"><img src="file:///usr/share/icons/Papirus/48x48/apps/firefox.svg" alt=""></span>
                            <span class="app-copy"><span class="app-name">Firefox</span></span>
                        </button>
                        <button class="app-row" id="app-terminal" type="button" role="option" aria-selected="false" tabindex="-1" data-name="Terminal">
                            <span class="app-icon" aria-hidden="true"><img src="file:///usr/share/icons/breeze/apps/24/utilities-terminal.svg" alt=""></span>
                            <span class="app-copy"><span class="app-name">Terminal</span></span>
                        </button>
                        <button class="app-row" id="app-files" type="button" role="option" aria-selected="false" tabindex="-1" data-name="Files">
                            <span class="app-icon" aria-hidden="true"><img src="file:///usr/share/icons/hicolor/scalable/apps/org.gnome.Nautilus.svg" alt=""></span>
                            <span class="app-copy"><span class="app-name">Files</span></span>
                        </button>
                    </div>
                    <div class="empty-state" id="empty-state" role="status" aria-live="polite" aria-atomic="true" hidden>
                        <strong id="empty-title">No applications found</strong>
                    </div>
                </div>

                <span class="sr-only"><strong id="launcher-selection">Visual Studio Code</strong> / <span id="launcher-action">application selection</span> / <span id="launcher-hint">esc to close</span></span>
                <p class="sr-only" id="launcher-status" aria-live="polite">Launcher ready.</p>
            </section>

            <button class="reopen-button" id="reopen-button" type="button" hidden>open launcher</button>
        </div>
    </main>

    <script>
        const form = document.querySelector("#launcher-form");
        const panel = document.querySelector("#launcher-panel");
        const input = document.querySelector("#launcher-input");
        const selection = document.querySelector("#launcher-selection");
        const action = document.querySelector("#launcher-action");
        const hint = document.querySelector("#launcher-hint");
        const status = document.querySelector("#launcher-status");
        const emptyState = document.querySelector("#empty-state");
        const emptyTitle = document.querySelector("#empty-title");
        const reopenButton = document.querySelector("#reopen-button");
        const allRows = [...document.querySelectorAll(".app-row")];
        let visibleRows = [...allRows];
        let selectedIndex = 0;
        let launchTimer;

        const announce = (message) => {
            status.textContent = message;
        };

        const setSelected = (row, focusInput = false) => {
            allRows.forEach((item) => {
                const selected = item === row;
                item.classList.toggle("is-selected", selected);
                item.setAttribute("aria-selected", String(selected));
                item.tabIndex = -1;
            });

            if (!row) {
                input.removeAttribute("aria-activedescendant");
                selection.textContent = "No selection";
                action.textContent = "refine search";
                selectedIndex = -1;
                return;
            }

            selection.textContent = row.dataset.name;
            action.textContent = "application selection";
            selectedIndex = Math.max(0, visibleRows.indexOf(row));
            input.setAttribute("aria-activedescendant", row.id);
            if (focusInput) input.focus();
        };

        const filterRows = () => {
            const term = input.value.trim().toLowerCase();
            visibleRows = allRows.filter((row) => {
                const visible = !term || row.dataset.name.toLowerCase().includes(term);
                row.hidden = !visible;
                return visible;
            });

            emptyState.hidden = visibleRows.length > 0;

            if (!visibleRows.length) {
                setSelected(null);
                emptyTitle.textContent = term
                    ? `No applications found for “${input.value.trim()}”`
                    : "No applications available";
                announce(term ? `No applications found for ${input.value.trim()}.` : "No applications available.");
                return;
            }

            const current = visibleRows.find((row) => row.classList.contains("is-selected")) || visibleRows[0];
            setSelected(current);
            announce(`${visibleRows.length} applications available.`);
        };

        const moveSelection = (direction) => {
            if (!visibleRows.length) return;
            selectedIndex = (selectedIndex + direction + visibleRows.length) % visibleRows.length;
            setSelected(visibleRows[selectedIndex], true);
            announce(`${visibleRows[selectedIndex].dataset.name} selected.`);
        };

        const closeLauncher = (reason) => {
            if (launchTimer) {
                window.clearTimeout(launchTimer);
                launchTimer = undefined;
            }

            const launchedName = selection.textContent;
            panel.hidden = true;
            panel.removeAttribute("aria-busy");
            input.setAttribute("aria-expanded", "false");
            reopenButton.hidden = false;
            input.disabled = false;
            input.value = "";
            hint.textContent = "esc to close";
            allRows.forEach((row) => row.classList.remove("is-launching"));
            filterRows();
            input.removeAttribute("aria-activedescendant");
            reopenButton.focus();
            announce(reason === "launch"
                ? `${launchedName} launch preview complete. Launcher closed.`
                : "Launcher closed. Press Enter to open it again.");
        };

        const openLauncher = () => {
            panel.hidden = false;
            panel.removeAttribute("aria-busy");
            input.setAttribute("aria-expanded", "true");
            reopenButton.hidden = true;
            input.disabled = false;
            input.value = "";
            hint.textContent = "esc to close";
            filterRows();
            input.focus();
            announce("Launcher open. Use Up and Down to navigate.");
        };

        const launchSelected = () => {
            if (panel.getAttribute("aria-busy") === "true") return;
            if (!visibleRows.length) {
                announce("No application selected. Refine the search to continue.");
                input.focus();
                return;
            }

            const row = visibleRows[selectedIndex] || visibleRows[0];
            setSelected(row);
            row.classList.add("is-launching");
            panel.setAttribute("aria-busy", "true");
            input.disabled = true;
            action.textContent = "launching";
            hint.textContent = "starting...";
            announce(`Launching ${row.dataset.name}.`);
            launchTimer = window.setTimeout(() => closeLauncher("launch"), 420);
        };

        input.addEventListener("input", filterRows);
        input.addEventListener("search", filterRows);

        form.addEventListener("submit", (event) => {
            event.preventDefault();
            launchSelected();
        });

        allRows.forEach((row) => {
            row.addEventListener("click", () => {
                setSelected(row, true);
                announce(`${row.dataset.name} selected.`);
            });
        });

        reopenButton.addEventListener("click", openLauncher);

        document.addEventListener("keydown", (event) => {
            if (panel.hidden) return;

            if (event.key === "Escape") {
                event.preventDefault();
                closeLauncher("escape");
                return;
            }

            if (panel.getAttribute("aria-busy") === "true") return;

            if (event.key === "ArrowDown" || event.key === "ArrowUp") {
                event.preventDefault();
                moveSelection(event.key === "ArrowDown" ? 1 : -1);
                return;
            }

            if (event.key === "Enter") {
                event.preventDefault();
                launchSelected();
            }
        });

        filterRows();
        input.focus();
    </script>
</body>
</html>
