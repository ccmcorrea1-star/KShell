<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KShell — barra</title>
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="bar-design.css">
</head>
<body>
    <main class="bar-preview">
        <h1 class="sr-only">Mockup da barra do KShell</h1>

        <section class="desktop-surface" aria-label="Área de trabalho ilustrativa">
            <header class="kshell-bar" aria-label="Barra do KShell">
                <nav class="workspace-nav" aria-label="Workspaces">
                    <button class="workspace" type="button" aria-label="Workspace 1">1</button>
                    <button class="workspace is-active" type="button" aria-current="page" aria-label="Workspace 2 ativo">2</button>
                    <button class="workspace" type="button" aria-label="Workspace 3">3</button>
                    <button class="workspace" type="button" aria-label="Workspace 4">4</button>
                    <button class="workspace" type="button" aria-label="Workspace 5">5</button>
                </nav>

                <time class="clock" datetime="2026-08-09T13:12:00-03:00" aria-label="Domingo, 9 de agosto, 13 horas e 12 minutos">
                    <span class="clock-date">dom 09 ago</span>
                    <span class="clock-divider" aria-hidden="true">•</span>
                    <span class="clock-time">13:12</span>
                </time>

                <div class="system-status" aria-label="Status do sistema">
                    <span class="status-item">
                        <svg class="status-icon" viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M2.5 6.25h2.25L8 3.5v9L4.75 9.75H2.5z"></path>
                            <path d="M10.25 6a3 3 0 0 1 0 4"></path>
                        </svg>
                        <span>42%</span>
                    </span>
                    <span class="status-item" role="img" aria-label="Rede conectada">
                        <svg class="status-icon" viewBox="0 0 16 16" aria-hidden="true">
                            <path d="M2.5 6.25a7.8 7.8 0 0 1 11 0"></path>
                            <path d="M4.75 8.5a4.6 4.6 0 0 1 6.5 0"></path>
                            <path d="M7 10.75a1.45 1.45 0 0 1 2 0"></path>
                            <path d="M8 13h.01"></path>
                        </svg>
                    </span>
                    <span class="status-item">
                        <svg class="status-icon" viewBox="0 0 16 16" aria-hidden="true">
                            <rect x="2" y="4.5" width="11" height="7" rx="1"></rect>
                            <path d="M13 7h1.5v2H13"></path>
                            <path d="M4 6.5h5.5v3H4z" class="battery-level"></path>
                        </svg>
                        <span>87%</span>
                    </span>
                </div>
            </header>
        </section>
    </main>
</body>
</html>
